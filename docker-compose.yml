version: '3.8'

services:
  devpilot:
    build: .
    container_name: devpilot-ai-swe
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SWYTCHCODE_API_KEY=${SWYTCHCODE_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-acme-corp}
      - GITHUB_REPO=${GITHUB_REPO:-ai-inference-service}
      - JIRA_URL=${JIRA_URL:-https://acme-corp.atlassian.net}
      - JIRA_USER=${JIRA_USER:-developer@acme.corp}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-#dev-alerts}
    volumes:
      - ./ai-inference-service:/app/ai-inference-service
    restart: unless-stopped
